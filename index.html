<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalTrack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <h1>LocalTrack</h1>
    <div id="timer-display">00:00:00</div>
    <div id="controls">
      <button id="start-btn">Start</button>
      <button id="pause-btn" disabled>Pause</button>
      <button id="stop-btn" disabled>Stop</button>
    </div>
    <div id="manual-entry">
      <h3>Manual Entry</h3>
      <form id="manual-form">
        <input type="text" id="project-name" placeholder="Project Name" required>
        <input type="date" id="entry-date" required>
        <input type="number" id="duration-hours" placeholder="Hours" min="0">
        <input type="number" id="duration-minutes" placeholder="Minutes" min="0" max="59">
        <textarea id="notes" placeholder="Notes (optional)"></textarea>
        <button type="submit" id="save-entry-btn">Save Entry</button>
      </form>
    </div>
    <div id="entries">
      <h3>Recent Entries</h3>
      <ul id="entry-list"></ul>
      <div id="export-buttons">
        <button id="export-json-btn">Export JSON</button>
        <button id="export-csv-btn">Export CSV</button>
        <button id="clear-storage-btn">Clear Data</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
