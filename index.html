<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>LocalTrack</h1>
    
    <!-- Timer Section -->
    <div class="timer-section">
      <div id="time-display">00:00:00</div>
      <div class="timer-controls">
        <button id="start-btn">Start</button>
        <button id="pause-btn">Pause</button>
        <button id="stop-btn">Stop</button>
      </div>
    </div>

    <!-- Manual Entry Form -->
    <div class="manual-entry-section">
      <h2>Manual Entry</h2>
      <form id="entry-form">
        <input type="text" id="project-name" placeholder="Project Name" required>
        <input type="date" id="entry-date" required>
        <div class="duration-inputs">
          <input type="number" id="hours" placeholder="Hours" min="0" max="23">
          <input type="number" id="minutes" placeholder="Minutes" min="0" max="59">
        </div>
        <textarea id="notes" placeholder="Notes (optional)"></textarea>
        <button type="submit">Save Entry</button>
      </form>
    </div>

    <!-- Summary and Entries -->
    <div class="summary-section">
      <h2>Today's Summary</h2>
      <p id="today-summary">Total: 0 hours 0 minutes</p>
    </div>

    <div class="entries-section">
      <h2>Recent Entries</h2>
      <div id="entries-list"></div>
      <button id="export-btn">Export Data</button>
      <button id="clear-btn">Clear All Data</button>
    </div>

    <script src="popup.js"></script>
  </div>
</body>
</html>
