<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalTrack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="popup">
    <h1>LocalTrack</h1>
    
    <section id="timerSection">
      <div id="timerDisplay">00:00:00</div>
      <div class="timer-controls">
        <button id="startBtn">Start</button>
        <button id="pauseBtn" style="display:none">Pause</button>
        <button id="stopBtn" style="display:none">Stop</button>
      </div>
    </section>

    <section id="manualEntrySection">
      <h2>Manual Entry</h2>
      <form id="manualForm">
        <label>Project Name:</label>
        <input type="text" id="project" required>
        <label>Date:</label>
        <input type="date" id="date" required>
        <label>Duration (Hours/Minutes):</label>
        <div class="duration-row">
          <input type="number" id="hours" placeholder="Hours" min="0">
          <input type="number" id="minutes" placeholder="Minutes" min="0" max="59">
        </div>
        <label>Notes:</label>
        <textarea id="notes" rows="2"></textarea>
        <button type="submit">Add Entry</button>
      </form>
    </section>

    <section id="recentEntriesSection">
      <h2>Recent Entries</h2>
      <div id="entriesList"></div>
    </section>

    <div class="actions">
      <button id="exportJson">Export JSON</button>
      <button id="exportCsv">Export CSV</button>
      <button id="clearBtn">Clear Data</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
