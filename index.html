<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalTrack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="popup">
    <h1>LocalTrack</h1>
    
    <section id="timer-section">
      <div id="timer-display">00:00:00</div>
      <div id="timer-controls">
        <button id="start-btn">Start</button>
        <button id="pause-btn">Pause</button>
        <button id="stop-btn">Stop</button>
      </div>
    </section>

    <section id="manual-entry">
      <h2>Manual Entry</h2>
      <form id="entry-form">
        <label for="project">Project:</label>
        <input type="text" id="project" name="project" required>
        
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>
        
        <label for="hours">Hours:</label>
        <input type="number" id="hours" name="hours" min="0" step="0.5">
        
        <label for="minutes">Minutes:</label>
        <input type="number" id="minutes" name="minutes" min="0" max="59">
        
        <label for="notes">Notes:</label>
        <textarea id="notes" name="notes"></textarea>
        
        <button id="save-entry-btn">Save Entry</button>
      </form>
    </section>

    <section id="summary">
      <h2>Today's Summary</h2>
      <div id="today-total">0 hours</div>
    </section>

    <section id="recent-entries">
      <h2>Recent Entries</h2>
      <ul id="entries-list"></ul>
    </section>

    <section id="export-section">
      <button id="export-json-btn">Export JSON</button>
      <button id="export-csv-btn">Export CSV</button>
      <button id="clear-storage-btn">Clear Storage</button>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
